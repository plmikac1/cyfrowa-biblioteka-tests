name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest playwright pytest-playwright pytest-xdist pytest-html requests

    - name: Install Playwright browsers
      run: |
        python -m playwright install --with-deps

    - name: Run tests
      env:
        BASE_URL: http://localhost:8000
      run: |
        pytest -q --maxfail=1